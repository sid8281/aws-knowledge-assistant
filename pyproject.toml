
[project]
name = "aws-case-studies-rag"
version = "0.1.0"
description = "AWS Case Studies RAG Assistant"
readme = "README.md"
requires-python = ">=3.11,<3.13"

dependencies = [
    # --- Web framework ---
    "fastapi>=0.141.1",
    "uvicorn[standard]>=0.52.4",
    "pydantic>=2.10.4",
    "slowapi>=0.1.9",

    # --- UI ---
    "streamlit>=1.41.1",

    # --- Agent orchestration ---
    "langgraph>=0.2.0,<0.3.0",
    "langgraph-checkpoint-postgres>=2.0.0",
    "psycopg[binary,pool]>=3.2.0",

    # --- LLM gateway ---
    "portkey-ai>=2.3.4",
    "openai>=1.109.1,<2.0.0",

    # --- Guardrails ---
    "nemoguardrails==0.23.0",

    # --- Embeddings ---
    # The local provider requires the optional local-embeddings extra.
    # This keeps torch/sentence-transformers out of the base installation
    # for memory-constrained deployments such as Render.
    "boto3>=1.35.0",

    # --- Vector store ---
    "qdrant-client>=1.12.1",

    # --- Reranking ---
    "flashrank>=0.2.9",

    # --- Retrieval ---
    "rank-bm25>=0.2.2",
    "tokenizers>=0.22.0,<=0.23.0",

    # --- Document loaders (ingestion) ---
    "pypdf>=5.1.0",
    "beautifulsoup4>=4.12.3",
    "python-docx>=1.1.2",
    "python-pptx>=1.0.2",

    # --- Evaluation ---
    "ragas>=0.2.9,<1.0.0",
    "deepeval>=4.1.8",
    "datasets>=3.2.0",
    "pandas>=2.2.3",
    "langsmith>=0.1.147",

    # --- AWS Documentation MCP fallback ---
    "mcp>=1.0.0",

    # --- Config ---
    "python-dotenv>=1.0.1",

    # --- Observability ---
    "logfire[fastapi]>=4.40.0",
]

[project.optional-dependencies]
# Required only when:
# EMBEDDING_PROVIDER=local
#
# This installs sentence-transformers and its heavy ML dependencies
# such as torch. Do not install this extra on memory-constrained
# deployments when using OpenAI or Bedrock embeddings.
local-embeddings = [
    "sentence-transformers>=3.0.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-mock>=3.14.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.27.0",
    "ruff>=0.8.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]

[tool.ruff]
line-length = 100
target-version = "py311"

